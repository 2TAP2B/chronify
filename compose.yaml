services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: puku
      POSTGRES_PASSWORD: puku
      POSTGRES_DB: puku
    volumes:
      - prod-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puku -d puku"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  app:
    image: git.steltner.cloud/2tap2b/time-track-v3:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://puku:puku@db:5432/puku?schema=public"
      NEXTAUTH_URL: "https://${APP_DOMAIN}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      AUTH_DEBUG: "${AUTH_DEBUG:-}"
      AUTH_SECURE_COOKIE: "true"
      CSRF_ALLOWED_ORIGINS: "https://${APP_DOMAIN},https://${KIOSK_DOMAIN}"
      KIOSK_HOST: "${KIOSK_DOMAIN}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-chronify@example.com}"
      SMTP_TLS: "${SMTP_TLS:-true}"
      NAGER_DATE_API_URL: "https://date.nager.at/api/v3"
      NAGER_DATE_DEFAULT_REGION: "DE"
      NAGER_DATE_DEFAULT_STATE: "NW"
      PUSH_VAPID_PUBLIC_KEY: "${PUSH_VAPID_PUBLIC_KEY:-}"
      PUSH_VAPID_PRIVATE_KEY: "${PUSH_VAPID_PRIVATE_KEY:-}"
      PUSH_VAPID_SUBJECT: "${PUSH_VAPID_SUBJECT:-mailto:admin@example.com}"
      DEFAULT_LOCALE: "${DEFAULT_LOCALE:-de}"
      DEFAULT_TIMEZONE: "${DEFAULT_TIMEZONE:-Europe/Berlin}"
      OIDC_ISSUER: "https://idp.sohn.uk"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET}"
      NEXT_PUBLIC_OIDC_ENABLED: "true"
      REPORTS_EXPORT_DIR: "${REPORTS_EXPORT_DIR:-/data/reports}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chroify.entrypoints=websecure"
      - "traefik.http.routers.chroify.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.chroify.tls=true"
      - "traefik.http.routers.chroify.service=chroify"
      - "traefik.http.routers.chroify.tls.certresolver=cloudflare"
      - "traefik.http.routers.kiosk.entrypoints=websecure"
      - "traefik.http.routers.kiosk.rule=Host(`${KIOSK_DOMAIN}`)"
      - "traefik.http.routers.kiosk.tls=true"
      - "traefik.http.routers.kiosk.tls.certresolver=cloudflare"
      - "traefik.http.routers.kiosk.service=chroify"
      - "traefik.http.services.chroify.loadbalancer.server.port=3000"
      - "traefik.docker.network=frontend"
    networks:
      - frontend
      - internal
    volumes:
      # Automated report export (PDF) — host bind mount for REPORTS_EXPORT_DIR.
      # The container user is `nextjs` (uid 1001): make sure the host dir is
      # writable for it, e.g. `install -d -o 1001 -g 1001 ./reports`.
      - ./reports:/data/reports

volumes:
  prod-db-data:

networks:
  frontend:
    external: true
  internal:
