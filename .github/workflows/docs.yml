name: docs

# Builds the Starlight docs site and deploys to GitHub Pages.
# Code-derived reference pages (prisma schema, API routes, env vars) are
# regenerated on every build by docs-site/scripts/gen.mjs — never committed.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-site/**"
      - "prisma/schema.prisma"
      - "src/**"
      - ".env.example"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: install
        run: npm ci --no-fund --no-audit
        working-directory: docs-site
      - name: build
        # CI=true keeps the committed generated files from leaking stale state;
        # gen.mjs writes into src/content/docs/reference before astro build.
        run: npm run build
        working-directory: docs-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
